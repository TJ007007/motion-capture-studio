/**
 * Virtualized timeline inspired by professional DAW/NLE tools.
 * @module timeline/Timeline
 */


/**
 * Canvas-based timeline with zoom, pan, playhead, in/out markers.
 */
class Timeline {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {import('../core/EventBus.js').EventBus} bus
   */
  constructor(canvas, bus) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.bus = bus;
    this.duration = 0;
    this.currentTime = 0;
    this.zoom = 1;
    this.pan = 0;
    this.inMarker = 0;
    this.outMarker = 0;
    this.sampleCount = 0;
    this._dragging = false;
    this._panning = false;
    this._lastX = 0;

    canvas.addEventListener('mousedown', (e) => this._onDown(e));
    canvas.addEventListener('mousemove', (e) => this._onMove(e));
    canvas.addEventListener('mouseup', () => { this._dragging = false; this._panning = false; });
    canvas.addEventListener('wheel', (e) => this._onWheel(e), { passive: false });
    canvas.addEventListener('dblclick', (e) => this._onDblClick(e));
  }

  /**
   * @param {number} duration ms
   * @param {number} samples
   */
  setData(duration, samples) {
    this.duration = duration;
    this.sampleCount = samples;
    this.outMarker = duration;
    this.draw();
  }

  /**
   * @param {number} t
   */
  setPlayhead(t) {
    this.currentTime = t;
    this.draw();
  }

  _timeToX(t) {
    const w = this.canvas.width;
    const visible = this.duration / this.zoom;
    const start = this.pan;
    return ((t - start) / visible) * w;
  }

  _xToTime(x) {
    const w = this.canvas.width;
    const visible = this.duration / this.zoom;
    const start = this.pan;
    return start + (x / w) * visible;
  }

  _onDown(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
    if (e.button === 1 || e.shiftKey) {
      this._panning = true;
      this._lastX = x;
    } else {
      this._dragging = true;
      const t = clamp(this._xToTime(x), 0, this.duration);
      this.bus.emit('timeline:seek', t);
    }
  }

  _onMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
    if (this._panning) {
      const dx = x - this._lastX;
      const visible = this.duration / this.zoom;
      this.pan -= (dx / this.canvas.width) * visible;
      this.pan = clamp(this.pan, 0, Math.max(0, this.duration - visible));
      this._lastX = x;
      this.draw();
    } else if (this._dragging) {
      const t = clamp(this._xToTime(x), 0, this.duration);
      this.bus.emit('timeline:seek', t);
    }
  }

  _onWheel(e) {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    this.zoom = clamp(this.zoom * factor, 1, 500);
    this.draw();
  }

  _onDblClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
    const t = clamp(this._xToTime(x), 0, this.duration);
    if (e.altKey) this.inMarker = t;
    else if (e.ctrlKey) this.outMarker = t;
    else this.bus.emit('timeline:seek', t);
    this.draw();
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.canvas.style.width = `${rect.width}px`;
    this.canvas.style.height = `${rect.height}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.draw();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.canvas.width / (window.devicePixelRatio || 1);
    const h = this.canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = 'rgba(10, 14, 20, 0.95)';
    ctx.fillRect(0, 0, w, h);

    const visible = this.duration / this.zoom || 1;
    const tickStep = this._niceStep(visible / 10);

    // Ticks
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
    ctx.fillStyle = '#8b9cb3';
    ctx.font = '10px system-ui';
    const startTick = Math.floor(this.pan / tickStep) * tickStep;
    for (let t = startTick; t < this.pan + visible; t += tickStep) {
      const x = this._timeToX(t);
      if (x < 0 || x > w) continue;
      ctx.beginPath();
      ctx.moveTo(x, h - 18);
      ctx.lineTo(x, h);
      ctx.stroke();
      ctx.fillText(`${(t / 1000).toFixed(2)}s`, x + 2, h - 4);
    }

    // Waveform proxy — decimated amplitude bars
    if (this.sampleCount > 0) {
      const bars = Math.min(800, Math.floor(w));
      const barW = w / bars;
      ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
      for (let i = 0; i < bars; i++) {
        const t0 = this.pan + (i / bars) * visible;
        const amp = 0.3 + 0.7 * Math.abs(Math.sin(t0 * 0.003 + i * 0.1));
        const bh = amp * (h - 24) * 0.5;
        ctx.fillRect(i * barW, h - 20 - bh, barW - 0.5, bh);
      }
    }

    // In/out markers
    ctx.fillStyle = 'rgba(0, 200, 120, 0.35)';
    ctx.fillRect(this._timeToX(this.inMarker), 0, this._timeToX(this.outMarker) - this._timeToX(this.inMarker), h);
    ctx.strokeStyle = '#00c878';
    ctx.strokeRect(this._timeToX(this.inMarker), 0, this._timeToX(this.outMarker) - this._timeToX(this.inMarker), h);

    // Playhead
    const px = this._timeToX(this.currentTime);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, h);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;

    // Frame label
    const frame = Math.round((this.currentTime / (this.duration || 1)) * this.sampleCount);
    ctx.fillStyle = '#e6edf5';
    ctx.fillText(`Frame ${frame} / ${this.sampleCount}`, 8, 14);
    ctx.fillText(`${(this.currentTime / 1000).toFixed(3)}s`, 8, 28);
  }

  _niceStep(rough) {
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / pow;
    const nice = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    return nice * pow;
  }
}

Timeline;



/**
 * Motion statistics and quality scoring engine.
 * @module statistics/StatisticsEngine
 */


/**
 * Computes recording and playback statistics.
 */
class StatisticsEngine {
  constructor() {
    this.stats = this._empty();
  }

  _empty() {
    return {
      duration: 0,
      sampleCount: 0,
      actualSampleRate: 0,
      peakAcceleration: 0,
      peakRotationSpeed: 0,
      peakGForce: 0,
      averageGForce: 0,
      distanceTravelled: 0,
      maxVelocity: 0,
      averageVelocity: 0,
      driftEstimate: 0,
      sensorQualityScore: 0,
      playbackFps: 0,
      memoryUsageEstimate: 0,
      motionQualityScore: 0,
      peakImpacts: 0,
    };
  }

  /**
   * @param {Array} samples
   * @param {number} [playbackFps]
   */
  compute(samples, playbackFps = 0) {
    if (!samples.length) {
      this.stats = this._empty();
      return this.stats;
    }

    let peakAcc = 0, peakRot = 0, peakG = 0, sumG = 0;
    let maxVel = 0, sumVel = 0, velCount = 0;
    let dist = 0;
    let gaps = 0;
    let impacts = 0;
    const duration = samples[samples.length - 1].timestamp - samples[0].timestamp;

    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const acc = Math.hypot(s.accel.x, s.accel.y, s.accel.z);
      peakAcc = Math.max(peakAcc, acc);
      const rot = Math.hypot(s.gyro.x, s.gyro.y, s.gyro.z);
      peakRot = Math.max(peakRot, rot);
      const g = acc / 9.80665;
      peakG = Math.max(peakG, g);
      sumG += g;
      if (g > 3) impacts++;

      const p = s.processed;
      if (p) {
        const v = Math.hypot(p.velocity.x, p.velocity.y, p.velocity.z);
        maxVel = Math.max(maxVel, v);
        sumVel += v;
        velCount++;
        dist = Math.max(dist, p.distance ?? 0);
      }
      if (i > 0) {
        const expected = 1000 / (samples[0].dt ? 1 / samples[0].dt : 60);
        const actual = samples[i].timestamp - samples[i - 1].timestamp;
        if (actual > expected * 2) gaps++;
      }
    }

    const actualRate = duration > 0 ? (samples.length / duration) * 1000 : 0;
    const mem = samples.length * 200; // rough bytes per sample estimate

    // Drift: distance when device likely stationary at end
    const tail = samples.slice(-Math.min(30, samples.length));
    let drift = 0;
    if (tail.length > 1) {
      const p0 = tail[0].processed?.position, p1 = tail[tail.length - 1].processed?.position;
      if (p0 && p1) drift = Math.hypot(p1.x - p0.x, p1.y - p0.y, p1.z - p0.z);
    }

    const gapPenalty = gaps / samples.length;
    const sensorQuality = Math.max(0, Math.min(100, 100 - gapPenalty * 500 - drift * 10));
    const motionQuality = Math.max(0, Math.min(100, sensorQuality * 0.6 + (peakG < 10 ? 20 : 0) + (actualRate > 25 ? 20 : 0)));

    this.stats = {
      duration,
      sampleCount: samples.length,
      actualSampleRate: actualRate,
      peakAcceleration: peakAcc,
      peakRotationSpeed: peakRot,
      peakGForce: peakG,
      averageGForce: sumG / samples.length,
      distanceTravelled: dist,
      maxVelocity: maxVel,
      averageVelocity: velCount ? sumVel / velCount : 0,
      driftEstimate: drift,
      sensorQualityScore: sensorQuality,
      playbackFps,
      memoryUsageEstimate: mem,
      motionQualityScore: motionQuality,
      peakImpacts: impacts,
    };
    return this.stats;
  }

  /**
   * @returns {Array<{ label: string, value: string }>}
   */
  toDisplayRows() {
    const s = this.stats;
    return [
      { label: 'Duration', value: `${(s.duration / 1000).toFixed(2)} s` },
      { label: 'Samples', value: String(s.sampleCount) },
      { label: 'Sample Rate', value: `${s.actualSampleRate.toFixed(1)} Hz` },
      { label: 'Peak Acceleration', value: `${s.peakAcceleration.toFixed(2)} m/s²` },
      { label: 'Peak Rotation', value: `${s.peakRotationSpeed.toFixed(2)} rad/s` },
      { label: 'Peak G-Force', value: `${s.peakGForce.toFixed(2)} g` },
      { label: 'Average G-Force', value: `${s.averageGForce.toFixed(2)} g` },
      { label: 'Distance', value: `${s.distanceTravelled.toFixed(3)} m` },
      { label: 'Max Velocity', value: `${s.maxVelocity.toFixed(3)} m/s` },
      { label: 'Avg Velocity', value: `${s.averageVelocity.toFixed(3)} m/s` },
      { label: 'Drift Estimate', value: `${s.driftEstimate.toFixed(3)} m` },
      { label: 'Sensor Quality', value: `${s.sensorQualityScore.toFixed(0)} / 100` },
      { label: 'Motion Quality', value: `${s.motionQualityScore.toFixed(0)} / 100` },
      { label: 'Playback FPS', value: String(s.playbackFps) },
      { label: 'Memory Est.', value: formatBytes(s.memoryUsageEstimate) },
      { label: 'Impact Events', value: String(s.peakImpacts) },
    ];
  }
}

/**
 * Multi-step sensor calibration wizard.
 * @module calibration/CalibrationWizard
 */

/**
 * Guides users through gravity, drift, and sensor calibration.
 */
class CalibrationWizard {
  /**
   * @param {import('../core/EventBus.js').EventBus} bus
   */
  constructor(bus) {
    this.bus = bus;
    this.step = 0;
    this.steps = [
      {
        id: 'gravity',
        title: 'Gravity Calibration',
        description: 'Place your device flat on a level surface, screen facing up. This establishes the gravity vector for orientation fusion.',
        when: 'Use before every session or when switching filter modes.',
        improvement: 'Improves tilt accuracy and gravity removal in filtered mode.',
      },
      {
        id: 'drift',
        title: 'Drift Calibration',
        description: 'Keep the device completely still for 5 seconds. The filter learns stationary bias to reduce position drift.',
        when: 'Use after gravity calibration and before recording motion.',
        improvement: 'Reduces velocity drift during slow movements.',
      },
      {
        id: 'sensor',
        title: 'Sensor Calibration',
        description: 'Rotate the device slowly through all axes for 10 seconds. Gyroscope bias is estimated.',
        when: 'Use when you notice rotation drift or after device temperature changes.',
        improvement: 'Improves quaternion stability and rotation tracking.',
      },
    ];
    this._samples = [];
    this._active = false;
    this._timer = null;
    this.results = { gravity: null, drift: null, gyroBias: null };
  }

  get currentStep() {
    return this.steps[this.step];
  }

  open() {
    this.step = 0;
    this._active = true;
    this.bus.emit('calibration:open', this.currentStep);
  }

  close() {
    this._active = false;
    clearTimeout(this._timer);
    this.bus.emit('calibration:close');
  }

  next() {
    if (this.step < this.steps.length - 1) {
      this.step++;
      this.bus.emit('calibration:step', this.currentStep);
    } else {
      this.bus.emit('calibration:complete', this.results);
      this.close();
    }
  }

  prev() {
    if (this.step > 0) {
      this.step--;
      this.bus.emit('calibration:step', this.currentStep);
    }
  }

  /**
   * Start collecting samples for current step.
   * @param {number} durationMs
   */
  startCapture(durationMs = 5000) {
    this._samples = [];
    const onSample = (sample) => this._samples.push(sample);
    this.bus.on('sensor:sample', onSample);
    this._timer = setTimeout(() => {
      this.bus.off('sensor:sample', onSample);
      this._processStep();
      this.next();
    }, durationMs);
    this.bus.emit('calibration:capturing', { step: this.currentStep.id, durationMs });
  }

  _processStep() {
    const id = this.currentStep.id;
    if (!this._samples.length) return;
    if (id === 'gravity') {
      const n = this._samples.length;
      const avg = this._samples.reduce((a, s) => ({
        x: a.x + s.accel.x, y: a.y + s.accel.y, z: a.z + s.accel.z,
      }), { x: 0, y: 0, z: 0 });
      this.results.gravity = { x: avg.x / n, y: avg.y / n, z: avg.z / n };
    } else if (id === 'drift') {
      this.results.drift = { stationary: true, sampleCount: this._samples.length };
    } else if (id === 'sensor') {
      const n = this._samples.length;
      const avg = this._samples.reduce((a, s) => ({
        x: a.x + s.gyro.x, y: a.y + s.gyro.y, z: a.z + s.gyro.z,
      }), { x: 0, y: 0, z: 0 });
      this.results.gyroBias = { x: avg.x / n, y: avg.y / n, z: avg.z / n };
    }
    this.bus.emit('calibration:result', { step: id, results: this.results });
  }
}

/**
 * CRC-32 integrity checking for binary recordings.
 * @module utils/crc32
 */

/** @type {Uint32Array} */
const TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) {
      c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    }
    t[i] = c >>> 0;
  }
  return t;
})();

/**
 * Compute CRC-32 over byte array.
 * @param {Uint8Array} data
 * @param {number} [seed=0xffffffff]
 * @returns {number}
 */
function crc32(data, seed = 0xffffffff) {
  let crc = seed;
  for (let i = 0; i < data.length; i++) {
    crc = TABLE[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

/**
 * Compressed binary recording format with CRC and chunk structure.
 * @module io/BinaryFormat
 */


const MAGIC = 0x4D435300; // 'MCS\0'
const VERSION = 1;
const CHUNK_META = 0x4D455441; // 'META'
const CHUNK_DATA = 0x44415441; // 'DATA'

/**
 * Encode recording to compressed binary blob.
 * @param {{ metadata: Object, samples: Array }} recording
 * @returns {Promise<Blob>}
 */
export async function exportBinary(recording) {
  const metaBytes = new TextEncoder().encode(JSON.stringify(recording.metadata));
  const n = recording.samples.length;
  const dataSize = n * 16 * 4; // 16 floats per sample
  const buf = new ArrayBuffer(32 + metaBytes.length + 12 + dataSize + 4);
  const view = new DataView(buf);
  let off = 0;

  view.setUint32(off, MAGIC, true); off += 4;
  view.setUint16(off, VERSION, true); off += 2;
  view.setUint16(off, 0, true); off += 2; // flags — reserved for gzip/LZ4
  view.setUint32(off, n, true); off += 4;
  view.setFloat64(off, recording.samples[0]?.timestamp ?? 0, true); off += 8;

  // META chunk
  view.setUint32(off, CHUNK_META, true); off += 4;
  view.setUint32(off, metaBytes.length, true); off += 4;
  new Uint8Array(buf, off, metaBytes.length).set(metaBytes);
  off += metaBytes.length;

  // DATA chunk — packed floats: ts, dt, ax,ay,az, gx,gy,gz, qw,qx,qy,qz, px,py,pz, dist
  view.setUint32(off, CHUNK_DATA, true); off += 4;
  view.setUint32(off, dataSize, true); off += 4;
  for (let i = 0; i < n; i++) {
    const s = recording.samples[i];
    const p = s.processed;
    view.setFloat32(off, s.timestamp, true); off += 4;
    view.setFloat32(off, s.dt, true); off += 4;
    view.setFloat32(off, s.accel.x, true); off += 4;
    view.setFloat32(off, s.accel.y, true); off += 4;
    view.setFloat32(off, s.accel.z, true); off += 4;
    view.setFloat32(off, s.gyro.x, true); off += 4;
    view.setFloat32(off, s.gyro.y, true); off += 4;
    view.setFloat32(off, s.gyro.z, true); off += 4;
    const q = p?.quaternion ?? { w: 1, x: 0, y: 0, z: 0 };
    view.setFloat32(off, q.w, true); off += 4;
    view.setFloat32(off, q.x, true); off += 4;
    view.setFloat32(off, q.y, true); off += 4;
    view.setFloat32(off, q.z, true); off += 4;
    const pos = p?.position ?? { x: 0, y: 0, z: 0 };
    view.setFloat32(off, pos.x, true); off += 4;
    view.setFloat32(off, pos.y, true); off += 4;
    view.setFloat32(off, pos.z, true); off += 4;
    view.setFloat32(off, p?.distance ?? 0, true); off += 4;
  }

  const body = new Uint8Array(buf, 0, off);
  const checksum = crc32(body);
  const finalBuf = new ArrayBuffer(off + 4);
  new Uint8Array(finalBuf).set(body);
  new DataView(finalBuf).setUint32(off, checksum, true);

  return new Blob([finalBuf], { type: 'application/octet-stream' });
}

/**
 * @param {ArrayBuffer} buffer
 * @returns {Promise<{ metadata: Object, samples: Array }>}
 */
export async function importBinary(buffer) {
  const view = new DataView(buffer);
  if (view.byteLength < 20) throw new Error('File too small to be a valid MCS binary recording.');

  const magic = view.getUint32(0, true);
  if (magic !== MAGIC) throw new Error('Unknown binary format (invalid magic).');

  const version = view.getUint16(4, true);
  if (version > VERSION) throw new Error(`Unsupported binary version: ${version}`);

  const checksumStored = view.getUint32(buffer.byteLength - 4, true);
  const body = new Uint8Array(buffer, 0, buffer.byteLength - 4);
  if (crc32(body) !== checksumStored) throw new Error('Corrupt file: CRC mismatch.');

  const sampleCount = view.getUint32(8, true);
  let off = 20;
  let metadata = {};

  while (off < buffer.byteLength - 4) {
    const chunkId = view.getUint32(off, true); off += 4;
    const chunkLen = view.getUint32(off, true); off += 4;
    if (chunkId === CHUNK_META) {
      metadata = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, off, chunkLen)));
      off += chunkLen;
    } else if (chunkId === CHUNK_DATA) {
      const samples = [];
      const floatsPer = 16;
      for (let i = 0; i < sampleCount; i++) {
        const base = off + i * floatsPer * 4;
        const ts = view.getFloat32(base, true);
        const dt = view.getFloat32(base + 4, true);
        const accel = { x: view.getFloat32(base + 8, true), y: view.getFloat32(base + 12, true), z: view.getFloat32(base + 16, true) };
        const gyro = { x: view.getFloat32(base + 20, true), y: view.getFloat32(base + 24, true), z: view.getFloat32(base + 28, true) };
        const q = { w: view.getFloat32(base + 32, true), x: view.getFloat32(base + 36, true), y: view.getFloat32(base + 40, true), z: view.getFloat32(base + 44, true) };
        const pos = { x: view.getFloat32(base + 48, true), y: view.getFloat32(base + 52, true), z: view.getFloat32(base + 56, true) };
        const dist = view.getFloat32(base + 60, true);
        samples.push({
          timestamp: ts, dt, accel, gyro,
          processed: { position: pos, quaternion: q, distance: dist, velocity: { x: 0, y: 0, z: 0 }, euler: { x: 0, y: 0, z: 0 }, linearAccel: accel, rotationSpeed: 0, gForce: 0 },
        });
      }
      return { metadata, samples };
    } else {
      off += chunkLen;
    }
  }
  throw new Error('Invalid binary file: missing DATA chunk.');
}

{ exportBinary, importBinary };


/**
 * Unified import/export with format auto-detection.
 * @module io/ImportExport
 */


/**
 * @param {{ metadata: Object, samples: Array }} recording
 * @param {'json'|'binary'} format
 * @returns {Promise<Blob>}
 */
export async function exportRecording(recording, format) {
  if (format === 'binary') return exportBinary(recording);
  return exportJson(recording);
}

/**
 * @param {File|Blob} file
 * @returns {Promise<{ metadata: Object, samples: Array }>}
 */
export async function importRecording(file) {
  const name = file.name?.toLowerCase() ?? '';
  if (name.endsWith('.json')) {
    const text = await file.text();
    return importJson(text);
  }
  if (name.endsWith('.mcs') || name.endsWith('.bin')) {
    return importBinary(await file.arrayBuffer());
  }

  // Auto-detect
  const buf = await file.arrayBuffer();
  const view = new DataView(buf);
  if (buf.byteLength >= 4 && view.getUint32(0, true) === 0x4D435300) {
    return importBinary(buf);
  }
  try {
    return importJson(new TextDecoder().decode(buf));
  } catch {
    throw new Error('Unable to detect file format. Use .json or .mcs files.');
  }
}

/**
 * Suggested filename for export.
 * @param {string} name
 * @param {'json'|'binary'} format
 */
function suggestFilename(name, format) {
  const safe = name.replace(/[^\w\- ]+/g, '').trim() || 'recording';
  return format === 'binary' ? `${safe}.mcs` : `${safe}.json`;
}

{ exportRecording, importRecording, suggestFilename };

  _buildFilePanel() {
    const el = document.getElementById('file-list');
    el.innerHTML = `
      <button class="tb-btn block" data-action="new">New</button>
      <button class="tb-btn block" data-action="open">Open…</button>
      <button class="tb-btn block" data-action="save">Save</button>
      <button class="tb-btn block" data-action="save-as">Save As…</button>
      <button class="tb-btn block" data-action="duplicate">Duplicate</button>
      <button class="tb-btn block" data-action="rename">Rename</button>
      <button class="tb-btn block" data-action="delete">Delete</button>

      <ul id="recent-list" class="recent-list"></ul>
      <h4>Export Format</h4>
      <select id="export-format"><option value="json">JSON</option><option value="binary">Binary (.mcs)</option></select>
    `;
  }

  _wireEvents() {
    const { bus, app } = this;

    this.root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      this._handleAction(btn.dataset.action);
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.dataset.tab}`)?.classList.add('active');
        this.resize();
      });
    });

    document.getElementById('sample-rate')?.addEventListener('change', (e) => {
      const rate = Number(e.target.value);
      app.settings.set('sampleRate', rate);
      app.sensors.setSampleRate(rate);
    });

    document.getElementById('playback-speed')?.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      document.getElementById('speed-label').textContent = `${v.toFixed(2)}×`;
      app.playback.setSpeed(v);
      app.settings.set('playbackSpeed', v);
    });

    document.getElementById('camera-mode')?.addEventListener('change', (e) => {
      app.settings.set('cameraMode', e.target.value);
      app.renderer.applySettings({ cameraMode: e.target.value });
    });

    document.getElementById('trail-mode')?.addEventListener('change', (e) => {
      app.settings.set('trailMode', e.target.value);
      app.renderer.applySettings({ trailMode: e.target.value });
    });

    document.getElementById('set-filter')?.addEventListener('change', (e) => {
      app.motion.setFilter(e.target.value);
      app.settings.set('filterMode', e.target.value);
    });

    document.getElementById('set-theme')?.addEventListener('change', (e) => app.settings.set('theme', e.target.value));
    document.getElementById('set-grid')?.addEventListener('change', (e) => {
      app.settings.set('gridVisible', e.target.checked);
      app.renderer.applySettings({ gridVisible: e.target.checked });
    });
    document.getElementById('set-shadows')?.addEventListener('change', (e) => {
      app.settings.set('shadowsEnabled', e.target.checked);
      app.renderer.applySettings({ shadowsEnabled: e.target.checked });
    });
    document.getElementById('set-wireframe')?.addEventListener('change', (e) => {
      app.settings.set('phoneWireframe', e.target.checked);
      app.renderer.applySettings({ phoneWireframe: e.target.checked });
    });
    document.getElementById('set-smoothing')?.addEventListener('input', (e) => {
      app.settings.set('motionSmoothing', Number(e.target.value));
      app.motion.setSmoothing(Number(e.target.value));
    });
    document.getElementById('set-reset')?.addEventListener('click', () => app.settings.reset());
    document.getElementById('set-calibrate')?.addEventListener('click', () => this._showCalibration());

    document.getElementById('file-input')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (file) await this._importFile(file);
      e.target.value = '';
    });

    bus.on('sensor:sample', (sample) => this._onLiveSample(sample));
    bus.on('recording:sample', () => this._refreshUnsaved());
    bus.on('playback:frame', (f) => this._onPlaybackFrame(f));
    bus.on('timeline:seek', (t) => app.playback.seek(t));
    bus.on('recording:loaded', () => this._onRecordingLoaded());
    bus.on('renderer:stats', (s) => this._updateStatus(s));
    bus.on('error', (err) => this.notify.show(err.message ?? String(err), 'error', 6000));
    bus.on('calibration:open', (step) => this._showCalibration(step));
  }

  async _handleAction(action) {
    const { app } = this;
    switch (action) {
      case 'new': app.fileManager.newRecording(); break;
      case 'open': document.getElementById('file-input')?.click(); break;
      case 'save': await this._save(false); break;
      case 'save-as': await this._save(true); break;
      case 'duplicate': app.fileManager.duplicate(); break;
      case 'rename': {
        const name = prompt('Recording name:', app.recorder.metadata.name);
        if (name) app.fileManager.rename(name);
        break;
      }
      case 'delete': app.fileManager.deleteRecording(); break;
      case 'record': await app.toggleRecording(); break;
      case 'play': app.playback.play(); break;
      case 'pause': app.playback.pause(); break;
      case 'stop': app.playback.stop(); break;
      case 'reverse': app.playback.reverse(); break;
      case 'prev-frame': app.playback.prevFrame(); break;
      case 'next-frame': app.playback.nextFrame(); break;
      case 'reset-camera': app.renderer.cameraCtrl.reset(); break;
      case 'screenshot': this._screenshot(); break;
      default: break;
    }
  }

  async _save(saveAs) {
    const format = document.getElementById('export-format')?.value === 'binary' ? 'binary' : 'json';
    const recording = this.app.recorder.getRecording();
    const blob = await exportRecording(recording, format);
    const name = suggestFilename(recording.metadata.name, format);
    await this.app.fileManager.saveAs(blob, name);
    this.notify.show('Recording saved.', 'success');
  }

  async _importFile(file) {
    this.showLoading(true);
    try {
      const data = await importRecording(file);
      this.app.loadRecording(data);
      this.notify.show(`Loaded ${file.name}`, 'success');
    } catch (err) {
      this.notify.show(err.message, 'error');
    } finally {
      this.showLoading(false);
    }
  }

  _setupDropZone() {
    const zone = this.root;
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', async (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer?.files?.[0];
      if (file) await this._importFile(file);
    });
  }

  _onLiveSample(sample) {
    const processed = this.app.motion.process(sample);
    const enriched = { ...sample, processed };
    if (this.app.recorder.recording) {
      this.app.recorder.addSample(enriched);
    }
    this.graphs.updateLive(enriched);
    this._updateDebug(enriched, processed);
    if (processed.position && processed.quaternion) {
      this.app.renderer.updatePhone(processed.position, processed.quaternion);
    }
    this._updateTrail();
  }

  _onPlaybackFrame({ time, frame, fps }) {
    this.timeline.setPlayhead(time);
    if (!frame) return;
    const p = frame.processed;
    if (p?.position && p?.quaternion) {
      this.app.renderer.updatePhone(p.position, p.quaternion);
    }
    this.graphs.updateLive(frame);
    this._updateDebug(frame, p);
    this._updateTrail(Math.floor(time / (this.app.playback.duration || 1) * this.app.recorder.count));
    const stats = this.stats.compute(this.app.recorder.samples, fps);
    this._renderStats(stats);
  }

  _onRecordingLoaded() {
    const { recorder, playback } = this.app;
    playback.setSamples(recorder.samples);
    this.timeline.setData(recorder.metadata.duration, recorder.count);
    const stats = this.stats.compute(recorder.samples);
    this._renderStats(stats);
    this._updateTrail();
    this._refreshRecent();
    this._refreshUnsaved();
  }

  _updateTrail(upToIndex) {
    const points = this.app.recorder.samples
      .filter((s) => s.processed?.position)
      .map((s) => ({ position: s.processed.position, quaternion: s.processed.quaternion }));
    this.app.renderer.updateTrail(points, upToIndex);
  }

  _renderStats(stats) {
    const el = document.getElementById('stats-panel');
    el.innerHTML = this.stats.toDisplayRows().map((r) =>
      `<div class="stat-row"><span>${r.label}</span><strong>${r.value}</strong></div>`,
    ).join('');
  }

  _updateDebug(sample, processed) {
    const el = document.getElementById('debug-panel');
    if (!el) return;
    el.textContent = JSON.stringify({
      rawAccel: sample.accel,
      rawGyro: sample.gyro,
      filtered: processed?.linearAccel,
      quaternion: processed?.quaternion,
      euler: processed?.euler,
      dt: sample.dt,
      fps: this.app.renderer.fps,
      renderMs: this.app.renderer.renderTime.toFixed(2),
      frame: this.app.recorder.count ? Math.round((this.app.playback.currentTime / (this.app.playback.duration || 1)) * this.app.recorder.count) : 0,
    }, null, 2);
  }

  _updateStatus({ fps, renderTime }) {
    document.getElementById('status-right').textContent =
      `Render ${fps} FPS (${renderTime.toFixed(1)} ms) | Samples ${this.app.recorder.count}`;
  }

  _refreshUnsaved() {
    document.getElementById('unsaved')?.classList.toggle('hidden', !this.app.recorder.unsaved);
  }

  _refreshRecent() {
    const list = document.getElementById('recent-list');
    const recent = this.app.fileManager.getRecent();
    list.innerHTML = recent.map((r) => `<li>${r}</li>`).join('') || '<li class="muted">No recent files</li>';
  }

  _screenshot() {
    const url = this.app.renderer.screenshot();
    const a = document.createElement('a');
    a.href = url;
    a.download = 'viewport.png';
    a.click();
    this.notify.show('Screenshot saved.', 'success');
  }

  _showCalibration(step) {
    const s = step ?? this.calibration.currentStep;
    const dlg = document.createElement('div');
    dlg.className = 'modal glass';
    dlg.innerHTML = `
      <div class="modal-box">
        <h2>${s.title}</h2>
        <p>${s.description}</p>
        <p class="muted"><strong>When:</strong> ${s.when}</p>
        <p class="muted"><strong>Expected improvement:</strong> ${s.improvement}</p>
        <div class="modal-actions">
          <button id="cal-prev">Back</button>
          <button id="cal-capture" class="accent">Start Capture</button>
          <button id="cal-next">Next</button>
          <button id="cal-close">Close</button>
        </div>
      </div>`;
    this.root.appendChild(dlg);
    dlg.querySelector('#cal-capture')?.addEventListener('click', () => this.calibration.startCapture());
    dlg.querySelector('#cal-prev')?.addEventListener('click', () => this.calibration.prev());
    dlg.querySelector('#cal-next')?.addEventListener('click', () => this.calibration.next());
    dlg.querySelector('#cal-close')?.addEventListener('click', () => { dlg.remove(); this.calibration.close(); });
    this.calibration.open();
  }

  _registerCommands() {
    const a = this.app;
    this.palette.register([
      { id: 'new', label: 'New Recording', category: 'File', action: () => a.fileManager.newRecording() },
      { id: 'open', label: 'Open File', category: 'File', action: () => document.getElementById('file-input')?.click() },
      { id: 'save', label: 'Save', category: 'File', action: () => this._save(false) },
      { id: 'record', label: 'Toggle Record', category: 'Record', action: () => a.toggleRecording() },
      { id: 'play', label: 'Play', category: 'Playback', action: () => a.playback.play() },
      { id: 'pause', label: 'Pause', category: 'Playback', action: () => a.playback.pause() },
      { id: 'cal', label: 'Calibration Wizard', category: 'Tools', action: () => this._showCalibration() },
      { id: 'palette', label: 'Command Palette', category: 'View', action: () => this.palette.show() },
      { id: 'screenshot', label: 'Screenshot Viewport', category: 'View', action: () => this._screenshot() },
      { id: 'filter-m', label: 'Filter: Madgwick', category: 'Motion', action: () => a.motion.setFilter('madgwick') },
      { id: 'filter-r', label: 'Filter: Raw', category: 'Motion', action: () => a.motion.setFilter('raw') },
    ]);
  }

  _registerShortcuts() {
    const a = this.app;
    this.keyboard.register([
      { key: 'p', ctrl: true, shift: true, action: () => this.palette.toggle(), label: 'Command Palette' },
      { key: ' ', ctrl: false, shift: false, action: () => a.recorder.recording ? a.toggleRecording() : a.playback.play(), label: 'Play/Record' },
      { key: 's', ctrl: true, action: () => this._save(false), label: 'Save' },
      { key: 'o', ctrl: true, action: () => document.getElementById('file-input')?.click(), label: 'Open' },
      { key: 'ArrowLeft', action: () => a.playback.prevFrame(), label: 'Previous Frame' },
      { key: 'ArrowRight', action: () => a.playback.nextFrame(), label: 'Next Frame' },
    ]);
  }

  showLoading(show) {
    document.getElementById('loading')?.classList.toggle('hidden', !show);
  }

  resize() {
    this.timeline.resize();
    this.graphs.resizeAll();
  }

  setStatus(msg) {
    document.getElementById('status-left').textContent = msg;
  }
}

/**
 * Application root — orchestrates all subsystems.
 * @module core/Application
 */


/**
 * Main application controller.
 */
class Application {
  constructor() {
    this.bus = new EventBus();
    this.plugins = new PluginAPI();
    this.settings = new SettingsManager(this.bus);
    this.sensors = new SensorManager(this.bus);
    this.motion = new MotionProcessor(this.bus);
    this.recorder = new Recorder(this.bus);
    this.fileManager = new RecordingManager(this.bus, this.recorder);
    this.playback = new PlaybackEngine(this.bus);
    this.renderer = null;
    this.ui = null;
    this._liveMode = false;
  }

  /**
   * Bootstrap DOM-dependent systems.
   */
  async init() {
    this.ui = new UIManager(this);

    const viewport = this.ui.viewportEl;
    if (!viewport) throw new Error('Viewport element not found.');

    this.renderer = new SceneRenderer(viewport, this.bus);

    const s = this.settings.settings;
    this.motion.setFilter(s.filterMode);
    this.motion.setSampleRate(s.sampleRate);
    this.motion.setSmoothing(s.motionSmoothing);
    this.sensors.setSampleRate(s.sampleRate);
    this.renderer.applySettings({
      gridVisible: s.gridVisible,
      shadowsEnabled: s.shadowsEnabled,
      trailMode: s.trailMode,
      phoneWireframe: s.phoneWireframe,
      cameraMode: s.cameraMode,
      autoFollowSmoothing: s.autoFollowSmoothing,
    });

    this.playback.setSpeed(s.playbackSpeed);
    this.fileManager.startAutosave();
    await this._checkRecovery();
    this._checkBrowserSupport();
    this.ui.setStatus('Ready — use Record on a motion-capable device');
    this.bus.emit('app:ready');
  }

  _checkBrowserSupport() {
    const av = this.sensors.availability;
    if (!av.accelerometer) {
      this.bus.emit('error', {
        code: 'UNSUPPORTED',
        message: 'Device motion sensors unavailable. You can still import recordings for playback and analysis.',
      });
    }
  }

  async _checkRecovery() {
    const saved = await this.fileManager.recoverAutosave();
    if (saved?.samples?.length) {
      if (confirm('Recover unsaved recording from auto-save?')) {
        this.loadRecording(saved);
        this.ui.notify.show('Recording recovered from auto-save.', 'success');
      } else {
        await this.fileManager.clearAutosave();
      }
    }
  }

  /**
   * @param {{ metadata: Object, samples: Array }} data
   */
  loadRecording(data) {
    this.motion.reset();
    this.motion.setFilter(data.metadata.filterMode ?? 'madgwick');
    this.recorder.load(data);
    this.playback.setSamples(this.recorder.samples);
    this.ui.timeline.setData(this.recorder.metadata.duration, this.recorder.count);
    this.ui.stats.compute(this.recorder.samples);
    this.ui._onRecordingLoaded();
  }

  /** Toggle live recording. */
  async toggleRecording() {
    if (this.recorder.recording) {
      this.recorder.stop();
      this.sensors.stop();
      this._liveMode = false;
      this.ui.setStatus('Recording stopped');
      this.ui.stats.compute(this.recorder.samples);
      this.ui._renderStats(this.ui.stats.stats);
      this.playback.setSamples(this.recorder.samples);
      this.ui.timeline.setData(this.recorder.metadata.duration, this.recorder.count);
      return;
    }

    const rate = this.settings.get('sampleRate');
    const filter = this.settings.get('filterMode');
    this.motion.reset();
    this.motion.setFilter(filter);
    const ok = await this.sensors.start();
    if (!ok) return;

    this.recorder.start(rate, this.sensors.availability, filter);
    this._liveMode = true;
    this.ui.setStatus('Recording…');
    this.ui.notify.show('Recording started', 'success');
  }
}

Application;


/**
 * Motion Capture Studio entry point.
 * @module main
 */


const app = new Application();

document.addEventListener('DOMContentLoaded', async () => {
  try {
    await app.init();
  } catch (err) {
    console.error('Failed to start Motion Capture Studio:', err);
    const el = document.getElementById('app');
    if (el) {
      el.innerHTML = `<div class="fatal-error glass"><h1>Startup Error</h1><p>${err.message}</p></div>`;
    }
  }
});

// Developer console hook
if (typeof window !== 'undefined') {
  window.MCS = app;
}

app;
